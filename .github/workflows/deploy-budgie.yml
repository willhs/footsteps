name: Deploy to budgie

# Every green CI run on main ships: build the web (static app in Caddy) and API images, push them
# to GHCR, and Watchtower on budgie pulls them within ~5 minutes (labels in
# deploy/budgie/docker-compose.yml). Then wait until https://footsteps.willhs.me/version.txt shows
# this commit and run the quick smoke (`live`). Pass: the images become `:good`. Fail: `rollback` points
# `:latest` back at the pinned `:good` digest, so Watchtower puts the previous image back and does not
# re-pull the bad one; medic is paged either way. `data` then runs the full smoke (data is not in git,
# so a data gap pages medic but is not rolled back). Data (population, terrain, habitat, fauna, evidence,
# PMTiles) is still published by hand: GRID_ONLY=1 scripts/deploy-budgie.sh. Runbook: README "Rolling back".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-budgie
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/willhs/footsteps-web
  API_IMAGE: ghcr.io/willhs/footsteps-api
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      web_prev: ${{ steps.pin.outputs.web }}
      api_prev: ${{ steps.pin.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before :latest moves: the digest to roll back to (:good, else the current :latest).
      - name: Pin the previous images
        id: pin
        run: |
          echo "web=$(scripts/image-pins.sh pin "$WEB_IMAGE")" >> "$GITHUB_OUTPUT"
          echo "api=$(scripts/image-pins.sh pin "$API_IMAGE")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/budgie/web/Dockerfile
          push: true
          build-args: GIT_SHA=${{ env.SHA }}
          tags: |
            ${{ env.REGISTRY }}/willhs/footsteps-web:latest
            ${{ env.REGISTRY }}/willhs/footsteps-web:${{ env.SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: deploy/budgie/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/willhs/footsteps-api:latest
            ${{ env.REGISTRY }}/willhs/footsteps-api:${{ env.SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # Is the new image up and answering? Failing here rolls back. Keep it quick and about the image only.
  live:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      skip: ${{ steps.wait.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Wait for Watchtower to roll out this commit
        id: wait
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://footsteps.willhs.me/version.txt)
          if [ "$code" = "404" ]; then
            echo "::warning::budgie is not running the footsteps-web image yet (no /version.txt). Run scripts/deploy-budgie.sh once from the home network."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for i in $(seq 1 40); do
            live=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' https://footsteps.willhs.me/version.txt || true)
            if [ "$live" = "$SHA" ]; then echo "live after ~$((i * 30))s"; exit 0; fi
            echo "live: ${live:-none}; waiting"
            sleep 30
          done
          echo "::error::footsteps.willhs.me/version.txt never showed $SHA (is Watchtower watching footsteps-web?)"
          exit 1

      - name: Quick smoke (app, API, one tile, one image of each kind)
        if: steps.wait.outputs.skip != '1'
        run: scripts/smoke.sh --quick https://footsteps.willhs.me

      - uses: docker/login-action@v3
        if: steps.wait.outputs.skip != '1'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This commit's images worked live: they are what a later bad deploy rolls back to.
      - name: Mark these images good
        if: steps.wait.outputs.skip != '1'
        run: |
          scripts/image-pins.sh promote "$WEB_IMAGE" "$SHA"
          scripts/image-pins.sh promote "$API_IMAGE" "$SHA"

  # The new image failed its quick smoke: put :latest back on the previous good digest. Watchtower then
  # pulls that (the bad tag is no longer :latest, so it is not re-pulled). Done when the site serves
  # another commit and the quick smoke passes. Fails (and pages medic) if it cannot.
  rollback:
    name: Roll back to the previous image
    needs: [images, live]
    if: failure() && needs.live.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest back at the previous images
        run: |
          scripts/image-pins.sh rollback "$WEB_IMAGE=${{ needs.images.outputs.web_prev }}" "$API_IMAGE=${{ needs.images.outputs.api_prev }}"
          echo "::warning::$SHA failed its post-deploy smoke; rolled :latest back to the previous images"
          echo "Rolled back $SHA: \`:latest\` is back on the previous images, so Watchtower restores them." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Watchtower to restore the previous image
        run: |
          for i in $(seq 1 40); do
            live=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' https://footsteps.willhs.me/version.txt || true)
            if [ -n "$live" ] && [ "$live" != "$SHA" ]; then echo "restored ($live) after ~$((i * 15))s"; exit 0; fi
            echo "live: ${live:-none}; waiting"
            sleep 15
          done
          echo "::error::footsteps.willhs.me still not serving a previous commit 10 min after the rollback"
          exit 1

      - name: Confirm the restored site is healthy
        run: scripts/smoke.sh --quick https://footsteps.willhs.me

  # Everything not in git (population, terrain, habitat PMTiles): a gap pages medic but is not an image problem.
  data:
    needs: live
    if: needs.live.outputs.skip != '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Full smoke of the live site
        run: scripts/smoke.sh https://footsteps.willhs.me

  # Page medic when a main deploy goes red (medic ADR 0003); medic de-dups on run_id. Best-effort.
  notify-medic:
    needs: [images, live, rollback, data]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report failure to medic
        env:
          MEDIC_URL: https://medic.willhs.me
          MEDIC_SECRET: ${{ secrets.MEDIC_SHARED_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          workflow_file="${GITHUB_WORKFLOW_REF%%@*}"; workflow_file="${workflow_file##*/}"
          cf_access=()
          if [ -n "${CF_ACCESS_CLIENT_ID}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET}" ]; then
            cf_access=(-H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")
          fi
          curl -fsS --max-time 15 -X POST "${MEDIC_URL}/incident" \
            "${cf_access[@]}" \
            -H "X-Medic-Secret: ${MEDIC_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg branch main \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --arg run_url "${RUN_URL}" \
              --arg workflow "${workflow_file}" \
              --arg conclusion "failure" \
              --arg head_sha "${SHA}" \
              --arg actor "${GITHUB_ACTOR}" \
              '{source:"ci", repo:$repo, branch:$branch, run_id:$run_id, run_url:$run_url, workflow:$workflow, conclusion:$conclusion, head_sha:$head_sha, actor:$actor}')" \
            || echo "::warning::medic unreachable; failure not paged"
