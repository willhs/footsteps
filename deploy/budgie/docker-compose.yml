# Lives at ~/projects/deep-footsteps/deploy/budgie on budgie.
# App files: ./app (rsynced static export). Tiles: ./pmtiles (rsynced, not in git).
services:
  web:
    image: caddy:2.8-alpine
    container_name: footsteps-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5090:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./app:/srv/app:ro
      - ./pmtiles:/srv/pmtiles:ro

  # "Imagine their day": Claude-written, cached, daily-capped. The key lives in
  # api.env on budgie (not in git); without it the API returns demo text.
  api:
    build: ./api
    container_name: footsteps-api
    restart: unless-stopped
    env_file:
      - path: ./api.env
        required: false
    environment:
      DAY_DB: /data/days.db
    volumes:
      - ./api-data:/data
