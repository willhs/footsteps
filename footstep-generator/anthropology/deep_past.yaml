  - id: south_america_early
    name: "Early South America: Monte Verde, fishtail points, Lagoa Santa"
    makers: ["H. sapiens"]
    bbox: [[-82, -56, -34, 13]]
    from_ka_bp: 15
    to_ka_bp: 11
    shelter: {phrase: "tent-like huts of wooden poles covered with hides, with hearths (Monte Verde, c. 14.5-14 ka); rock-shelter camps", material: "wood, hide, earth"}
