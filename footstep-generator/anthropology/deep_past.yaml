# Material culture and prey for the modelled deep past (100,000-11,000 BCE), per region and time.
# Read by build.py (`deep`), which writes it into the atlas next to the arrival table
# (footstep-generator/prehistory/arrivals.yaml). Nothing here is gap-filled by a model.
#
# One entry per technocomplex (a named stone-tool tradition, with what archaeology links to it).
#   makers      who made it: "H. sapiens", "Neanderthals", "Denisovans". Only entries with
#               "H. sapiens" speak for a clicked person; the others are labelled as another hominin's.
#   bbox        [west, south, east, north] degrees; any box may hold the cell centre
#   from_ka_bp / to_ka_bp   start (older) and end (younger), thousands of years before 1950.
#               Real traditions overlap and fade in and out by site; these are round, regional spans.
#   shelter     {phrase, material}: what archaeologists found people living in or under
#   tools       [{role, items}]; ornaments; art: what is recorded, as short phrases
#   summary     one line shown with the name
#   verification  checked          = the cited papers exist (DOI in `source`) and the key claim (the span and the
#                                    dated finds) was confirmed against the paper's abstract or full text;
#                 could_not_verify = the key claim could not be confirmed.
#                 Both may carry `could_not_verify`: a sentence naming what no paper was found for (for a
#                 `could_not_verify` entry it is required and says why). The atlas shows it in each field's note.
#                 No entry is left as `memory` (the 2026-11-19 pass; docs/research/0013-arrivals-deep-past-source-check).
#                 Abstract-level means the abstract (Europe PMC, Crossref, publisher page); full text was not read
#                 except where `source` says so.
#   source      the papers or books behind the entry, with DOIs
# Selection (atlas.py): of the entries holding the cell centre, those overlapping the era; the one
# overlapping the most wins, the one with the smaller box on a tie (then the earlier in this file).
#
# Where a field is empty the archaeology is silent or this table has not covered it: the atlas says
# "none" and lets the model gap-fill (clothing, diet, looks), marked as model.

version: 1

cultures:
  # ---- Africa ------------------------------------------------------------------------------
  - id: aterian
    name: "Aterian (North Africa, Middle Stone Age)"
    makers: ["H. sapiens"]
    bbox: [[-17, 18, 35, 37]]
    from_ka_bp: 145
    to_ka_bp: 40
    shelter: {phrase: "caves and rock shelters with hearths", material: "stone and hearth, no built walls recorded"}
    tools:
      - {role: hunting, items: ["tanged stone points, probably hafted spear or dart tips", "side scrapers"]}
      - {role: processing, items: ["flake scrapers for hides and wood", "Levallois flakes"]}
    ornaments: ["perforated sea-shell beads (Taforalt, c. 82 ka)", "ochre"]
    art: []
    summary: "Tanged points and shell beads across the Maghreb and Sahara, long before Europe's Upper Palaeolithic."
    verification: checked
    could_not_verify: "The hide-and-wood use of scrapers, hafting of the points and the cave-with-hearths wording are general descriptions with no paper behind them here; Scerri 2013's abstract was not reachable. The old radiocarbon end of ~24.5 ka is discounted (the best-dated tanged material ends 57-40 ka), so the span now ends at 40 rather than 30."
    source: "Bouzouggar et al. 2007 PNAS 104:9964 (doi:10.1073/pnas.0703877104; Taforalt shell beads c. 82 ka); Richter et al. 2010 J Hum Evol 59:672 (doi:10.1016/j.jhevol.2010.07.024; Ifri n'Ammar: earliest tanged layer 145 ka by TL, a later layer with ornaments 83.3 ka); Scerri 2013 Quat Int 300:111 (doi:10.1016/j.quaint.2012.09.008)."

  - id: iberomaurusian
    name: "Iberomaurusian (Maghreb, Late Stone Age)"
    makers: ["H. sapiens"]
    bbox: [[-17, 28, 12, 37]]
    from_ka_bp: 22
    to_ka_bp: 11
    shelter: {phrase: "cave camps near the coast and uplands; large cemeteries at Taforalt", material: "stone and hearth"}
    tools:
      - {role: hunting, items: ["backed bladelets, probably set in spears and arrows", "Barbary sheep and gazelle as main game"]}
      - {role: gathering, items: ["grinding stones for acorns, pine nuts and wild plants", "land snail collecting"]}
    ornaments: ["perforated shells", "pierced animal teeth"]
    art: ["engraved and painted pebbles are rare"]
    summary: "Backed-bladelet foragers of the Maghreb, c. 22-11 ka, who ground acorns and buried their dead in cave cemeteries."
    verification: checked
    could_not_verify: "No source found for Barbary sheep and gazelle as main game, land snail collecting, the ornaments or the rare painted pebbles. Taforalt's start is ~21-22 ka (Barton et al. 2013, from a search summary of the abstract); other Maghreb sites may start earlier (up to ~25 ka), which was not checked."
    source: "Humphrey et al. 2014 PNAS 111:954 (doi:10.1073/pnas.1318176111; Grotte des Pigeons, Taforalt: a cemetery, acorns and pine nuts processed 15-13.7 cal ka BP); Barton et al. 2013 J Hum Evol 65:266 (doi:10.1016/j.jhevol.2013.06.003; 54 AMS dates, earliest Iberomaurusian at Taforalt >= 21.16 cal ka BP). An earlier note cited Humphrey 2014 as Quat Sci Rev; it is PNAS."

  - id: africa_msa
    name: "Middle Stone Age (Africa)"
    makers: ["H. sapiens"]
    bbox: [[-20, -35, 52, 37]]
    from_ka_bp: 320
    to_ka_bp: 40
    shelter: {phrase: "caves, rock shelters and open camps with hearths; grass and sedge bedding laid on the floor", material: "stone, hearth, plant bedding"}
    tools:
      - {role: hunting, items: ["stone-tipped spears", "small stone points, perhaps arrow tips from c. 64 ka", "heat-treated stone for sharper flakes"]}
      - {role: processing, items: ["bone awls and points", "ochre grinding stones", "ochre-and-resin glue for hafting"]}
    ornaments: ["shell beads strung from Nassarius snails (Blombos, c. 75 ka)", "ochre"]
    art: ["engraved ochre (Blombos, c. 77 ka)", "ochre crayon drawing on stone (Blombos, c. 73 ka)", "engraved ostrich eggshell (Diepkloof, c. 60 ka)"]
    summary: "The Middle Stone Age of the first Homo sapiens: hafted points, shell beads, engraved ochre."
    verification: checked
    could_not_verify: "No paper was found for stone-tipped spears and bone awls and points as general descriptions; the text of McBrearty & Brooks 2000 was not read for MSA claims. The end at 40 ka is a round cut-off (the MSA persists later in places)."
    source: "McBrearty & Brooks 2000 J Hum Evol 39:453 (doi:10.1006/jhev.2000.0435); Brooks et al. 2018 Science 360:90 (doi:10.1126/science.aao2646; earliest MSA with pigment and prepared cores at Olorgesailie, >= 295 to ~320 ka); Henshilwood et al. 2002 Science 295:1278 (doi:10.1126/science.1067575; Blombos engraved ochre c. 77 ka); Henshilwood et al. 2018 Nature 562:115 (doi:10.1038/s41586-018-0514-3; ochre crayon drawing 73 ka); d'Errico et al. 2005 J Hum Evol 48:3 (doi:10.1016/j.jhevol.2004.09.002; Blombos Nassarius beads ~75 ka); Texier et al. 2010 PNAS 107:6180 (doi:10.1073/pnas.0913047107; Diepkloof ~60 ka); Wadley et al. 2011 Science 334:1388 (doi:10.1126/science.1213317; Sibudu bedding); Wadley et al. 2009 PNAS 106:9590 (doi:10.1073/pnas.0900957106; compound adhesive); Brown et al. 2012 Nature 491:590 (doi:10.1038/nature11660; heat treatment ~71 ka); Lombard & Phillipson 2010 Antiquity 84:635 (doi:10.1017/S0003598X00100134; bow and arrow ~64 ka)."

  - id: africa_lsa
    name: "Later Stone Age (Africa)"
    makers: ["H. sapiens"]
    bbox: [[-20, -35, 52, 28]]
    from_ka_bp: 44
    to_ka_bp: 11
    shelter: {phrase: "rock shelters and open-air camps with hearths and windbreaks", material: "stone, brush and hide"}
    tools:
      - {role: hunting, items: ["bows and small stone-tipped arrows", "bone arrowheads and poison-grooved points", "snares and traps"]}
      - {role: gathering, items: ["digging sticks weighted with bored stones", "ostrich eggshell water containers"]}
      - {role: processing, items: ["bone needles and awls", "tiny stone scrapers and backed blades (microliths)"]}
    ornaments: ["ostrich eggshell beads", "pierced shells and teeth"]
    art: ["painted slabs (Apollo 11 Cave, Namibia, c. 27-25 ka, radiocarbon years)", "rock engravings and paintings, mostly later and hard to date"]
    summary: "Microlith foragers of the Later Stone Age: bows, ostrich eggshell beads, bone needles. The earliest dated start is c. 44-42 ka at Border Cave; other regions start later."
    verification: checked
    could_not_verify: "Ambrose 1998 (doi:10.1006/jasc.1997.0277, East African LSA chronology) abstract was not reachable, and no source was found for later starts in other regions (an earlier note said c. 20 ka in the south; Border Cave contradicts it). Snares, traps and water containers have no paper here. The Apollo 11 dates are radiocarbon years, not calibrated."
    source: "Villa et al. 2012 PNAS 109:13208 (doi:10.1073/pnas.1202629109; Border Cave LSA from 44-42 cal ka BP: ostrich eggshell beads, bone arrowheads, bored stones, digging sticks, microliths hafted with pitch); Ambrose 1998 J Archaeol Sci 25:377 (doi:10.1006/jasc.1997.0277); Wendt 1976 S Afr Archaeol Bull 31:5 (doi:10.2307/3888265; Apollo 11 painted slabs, 27.5-25.5 ka BP, from a secondary summary); Vogelsang et al. 2010 J Afr Archaeol 8:185 (doi:10.3213/1612-1651-10170). An earlier note cited Ambrose 1998 as J Hum Evol 34:623, which is the Toba paper, and Mitchell 2002, a book with no checkable page."

  # ---- Levant and Arabia -------------------------------------------------------------------
  - id: levant_epipalaeolithic
    name: "Epipalaeolithic: Kebaran and Natufian (Levant)"
    makers: ["H. sapiens"]
    bbox: [[32, 28, 45, 38]]
    from_ka_bp: 23
    to_ka_bp: 11.5
    shelter: {phrase: "from mobile camps and brush huts (Ohalo II, c. 23 ka) to the first stone-footed round huts of the Natufian (c. 15-11.5 ka)", material: "stone footings, brush and hides"}
    tools:
      - {role: hunting, items: ["tiny geometric stone blades set in spears and arrows", "gazelle as main game"]}
      - {role: gathering, items: ["grinding stones and mortars", "sickle blades with gloss from cutting wild cereals"]}
    ornaments: ["dentalium shell beads", "bone and stone pendants"]
    art: ["small carved animal figures in stone and bone (Natufian)"]
    summary: "Kebaran camps and the Natufian base camps of the Levant, where foragers began living in one place and harvesting wild grain."
    verification: checked
    could_not_verify: "Bar-Yosef 1998's abstract was behind a 403 page; no source was checked for stone-footed huts, dentalium beads, sickle gloss or the carved figures. The Natufian date is the 15-11.5 ka of Grosman et al.; an earlier '14.5 ka' (sedentary phase) was not confirmed."
    source: "Maher, Richter & Stock 2012 Evol Anthropol 21:69 (doi:10.1002/evan.21307; Epipalaeolithic c. 23,000-11,500 cal BP); Nadel et al. 2004 PNAS 101:6821 (doi:10.1073/pnas.0308557101; Ohalo II brush huts, hearth and grass bedding, 23 ka); Grosman, Munro & Belfer-Cohen 2008 PNAS 105:17665 (doi:10.1073/pnas.0806030105; Natufian 15,000-11,500 cal BP); Bar-Yosef 1998 Evol Anthropol 6:159 (doi:10.1002/(SICI)1520-6505(1998)6:5<159::AID-EVAN4>3.0.CO;2-7)."

  - id: levant_upper_palaeolithic
    name: "Early Ahmarian and Levantine Aurignacian"
    makers: ["H. sapiens"]
    bbox: [[32, 28, 45, 38]]
    from_ka_bp: 47
    to_ka_bp: 23
    shelter: {phrase: "cave and rock-shelter camps with hearths", material: "stone and hearth"}
    tools:
      - {role: hunting, items: ["narrow stone blades and points (Ahmarian), set in spears", "mountain gazelle and fallow deer"]}
      - {role: processing, items: ["bone points and awls", "end scrapers"]}
    ornaments: ["perforated marine shells", "bone and antler pendants"]
    art: []
    summary: "The Upper Palaeolithic of the Levant, with blade technology like Europe's earliest."
    verification: checked
    could_not_verify: "The span runs to 23 ka so it meets the Epipalaeolithic, but the dated Ahmarian and Levantine Aurignacian layers end c. 40-30 ka (Richter 2020; Shemer 2024). No source was found for bone and antler pendants or bone points and awls. 'Wild cattle' was dropped: the Manot Cave fauna (Yeshurun 2021) has none."
    source: "Boaretto et al. 2021 PNAS 118:e2014657118 (doi:10.1073/pnas.2014657118; Boker Tachtit early phase 50-49 ka, Initial Upper Palaeolithic ~50 ka, Ahmarian of the Mediterranean zone 47-44 ka); Douka et al. 2013 PLoS ONE 8:e72931 (doi:10.1371/journal.pone.0072931; Ksar Akil Bayesian dating, 42.4-39.2 ka cal BP layers); Kuhn et al. 2001 PNAS 98:7641 (doi:10.1073/pnas.121590798; marine shell beads at Ksar 'Akil and Ucagizli, 41-43 ka cal). An earlier note cited an unspecified 'Bar-Yosef 2007', which could not be tied to a paper."

  - id: levant_middle_palaeolithic
    name: "Levantine Mousterian (Middle Palaeolithic)"
    makers: ["H. sapiens", "Neanderthals"]
    bbox: [[32, 12, 60, 38]]
    from_ka_bp: 250
    to_ka_bp: 47
    shelter: {phrase: "caves and rock shelters with hearths", material: "stone and hearth"}
    tools:
      - {role: hunting, items: ["Levallois flakes and points, perhaps hafted as spear tips"]}
      - {role: processing, items: ["side scrapers", "ochre"]}
    ornaments: ["perforated Nassarius shells (Skhul, c. 100-135 ka)", "strung Glycymeris shells with ochre (Qafzeh, c. 92 ka)"]
    art: ["ochre pieces selected for colour (Qafzeh, c. 92 ka)", "burials (Qafzeh)"]
    summary: "Mousterian toolkit shared by early Homo sapiens (Skhul, Qafzeh) and Neanderthals in the Levant."
    verification: checked
    could_not_verify: "The 250 ka start and the Neanderthals as makers (Tabun, Kebara) were not checked here; Misliya (177-194 ka, sapiens) is the oldest dated Levantine find. 'Burials with grave goods' was cut to 'burials': the Qafzeh paper confirms graves, not grave goods. A 2020 PLoS ONE paper (doi:10.1371/journal.pone.0234924) reportedly dates the Qafzeh shells to ~120 ka; it was not read."
    source: "Vanhaeren et al. 2006 Science 312:1785 (doi:10.1126/science.1128139; Nassarius shells at Skhul and Oued Djebbana); Bar-Yosef Mayer et al. 2009 J Hum Evol 56:307 (doi:10.1016/j.jhevol.2008.10.005; Qafzeh ~92 ka: perforated Glycymeris shells, ochre, graves); Hovers et al. 2003 Curr Anthropol 44:491 (doi:10.1086/375869; Qafzeh ochre ~92 ka); Hershkovitz et al. 2018 Science 359:456 (doi:10.1126/science.aap8369; Misliya 177-194 ka). An earlier note put the Qafzeh ornaments as Nassarius at 100-90 ka; they are Glycymeris at ~92 ka."

  # ---- Europe ------------------------------------------------------------------------------
  - id: solutrean
    name: "Solutrean (France and Iberia)"
    makers: ["H. sapiens"]
    bbox: [[-10, 36, 5, 48]]
    from_ka_bp: 24.5
    to_ka_bp: 19.5
    shelter: {phrase: "cave and rock-shelter camps by the Franco-Cantabrian coast and valleys", material: "stone and hearth, hide windbreaks"}
    tools:
      - {role: hunting, items: ["finely pressure-flaked laurel-leaf and shouldered points", "spear-throwers", "red deer, horse and ibex as main game"]}
      - {role: processing, items: ["bone needles with eyes, for sewing close-fitting clothes", "end scrapers"]}
    ornaments: ["pierced shells and animal teeth"]
    art: ["engraved and painted plaques (Parpalló, Spain; Solutrean and Magdalenian layers)"]
    summary: "Solutrean hunters of the last glacial peak, with the best-made stone points and western Europe's first eyed needles."
    verification: checked
    could_not_verify: "No dating paper was found for the Parpalló plaques; pressure flaking, spear-throwers, the game list, end scrapers and ornaments have no paper here. Eyed needles are older in Siberia (Denisova, ~40 ka) and Kostenki (~30 ka), so 'first' is for western Europe only."
    source: "Cascalheira & Bicho 2015 PLoS ONE 10:e0137308 (doi:10.1371/journal.pone.0137308; Bayesian chronology of 13 southern Iberian sequences, Solutrean ~25-19 cal ka BP, from the abstract and a search snippet); Gilligan et al. 2024 Sci Adv 10:eadp2887 (doi:10.1126/sciadv.adp2887; eyed needles first at Denisova ~40 ka, in western Europe with the Solutrean)."

  - id: magdalenian
    name: "Magdalenian (western and central Europe)"
    makers: ["H. sapiens"]
    bbox: [[-10, 36, 22, 56]]
    from_ka_bp: 20
    to_ka_bp: 14
    shelter: {phrase: "cave and rock-shelter camps, and open-air hide tents with hearths and paved floors", material: "hide, wood, stone"}
    tools:
      - {role: hunting, items: ["antler and bone harpoons and spear points", "spear-throwers carved with animals", "reindeer, horse, red deer and bison as main game"]}
      - {role: processing, items: ["bone needles", "burins for working antler", "stone scrapers"]}
    ornaments: ["pierced shells and animal teeth", "ivory and jet pendants"]
    art: ["painted and engraved caves (Lascaux, Altamira, Niaux)", "carved antler and ivory figures"]
    summary: "Magdalenian reindeer and horse hunters, famous for cave paintings and carved antler."
    verification: could_not_verify
    could_not_verify: "The 20-14 ka span rests on a search snippet of Miller 2012 (earliest Magdalenian-related dates ~20-19 cal ka BP, the Bolling-Allerod to ~12.9 ka); its text and the antler, shelter, game and ornament claims were not read. Pike et al. 2012 dates 11 Spanish caves but could not be matched to Altamira's Magdalenian layers, Lascaux or Niaux (Lascaux sits near the Solutrean-Magdalenian boundary)."
    source: "Miller 2012 Quat Int 272-273:209 (doi:10.1016/j.quaint.2012.05.034; Northwest Magdalenian expansion); Pike et al. 2012 Science 336:1409 (doi:10.1126/science.1219957; U-series dates of Spanish cave art). An earlier note cited Straus 1992 and Bahn & Vertut 1997, books with no checkable page."

  - id: azilian
    name: "Azilian and Late Epigravettian (Late Glacial Europe)"
    makers: ["H. sapiens"]
    bbox: [[-10, 36, 22, 56]]
    from_ka_bp: 14
    to_ka_bp: 11
    shelter: {phrase: "tents and rock-shelter camps near rivers and lakes", material: "hide, wood, stone"}
    tools:
      - {role: hunting, items: ["small backed points and bone barbs", "red deer, roe deer, aurochs and horse"]}
      - {role: fishing, items: ["bone fish gorges and harpoons"]}
    ornaments: ["pierced shells and teeth"]
    art: ["painted pebbles (Azilian)"]
    summary: "Late Glacial foragers of the warming West, after the Magdalenian."
    verification: could_not_verify
    could_not_verify: "No dated paper was found for the Azilian's tools, fish gorges or the Mas d'Azil painted pebbles (many pebbles in old collections are forgeries). Sources disagree on its dates: 14-12 ka (French Ministry of Culture), 12.5-10 ka BP uncalibrated (Wikipedia), 11-9.5 ka for the pebbles (British Museum); the 14-11 ka span is a loose compromise. The earlier citation 'Straus' had no year."
    source: "No checkable source. Candidate not yet read: 'Azilian pebbles in British collections: a reexamination' (Proc Prehist Soc)."

  - id: epigravettian
    name: "Epigravettian (Italy, Balkans, Black Sea)"
    makers: ["H. sapiens"]
    bbox: [[8, 36, 42, 52]]
    from_ka_bp: 25
    to_ka_bp: 11
    shelter: {phrase: "cave and rock-shelter camps; tents and, on the plains, huts built of mammoth bones", material: "hide, wood, bone, stone"}
    tools:
      - {role: hunting, items: ["small backed stone points", "red deer, ibex, horse and aurochs"]}
      - {role: processing, items: ["bone needles", "end scrapers"]}
    ornaments: ["pierced shells", "beads"]
    art: ["engraved bones and stones (Grotta Romanelli, Italy)"]
    summary: "Southern Europe's refuge foragers through the Ice Age maximum and after."
    verification: checked
    could_not_verify: "Grotta Romanelli's engraved pieces have no date (its layer E bone is ~13.4-13.2 cal ka BP, Calcagnile et al. 2019, no DOI found); the game, needles, scrapers, ornaments and shelters have no paper here. The start moved from 22 to 25 ka: Ruiz-Redondo's Early Epigravettian begins ~26-25 ka in the Adriatic region. Mammoth-bone huts belong to Ukraine (Mezhirich), inside this box."
    source: "Ruiz-Redondo et al. 2022 Quat Sci Rev 276:107319 (doi:10.1016/j.quascirev.2021.107319; 278 dates at 66 sites: Gravettian ~35-34 to 26-25 ka, Early Epigravettian ~26-25 to 18.1-17.6, Late ~17.6-17.1 to 11.9-11.6 cal ka BP); Chu, Shydlovskyi & Maier 2025 Open Res Eur 5:198 (doi:10.12688/openreseurope.20112.1; Mezhirich mammoth-bone structure 4, 18,248-17,764 cal BP). An earlier note cited Mussi 2002 and Soffer 1985, books with no checkable page."

  - id: gravettian
    name: "Gravettian (Europe)"
    makers: ["H. sapiens"]
    bbox: [[-10, 36, 42, 56]]
    from_ka_bp: 34
    to_ka_bp: 25
    shelter: {phrase: "tents and huts of hide over wooden or mammoth-bone frames on the plains, caves in the west", material: "hide, wood, bone"}
    tools:
      - {role: hunting, items: ["small backed blades and points set in spears", "nets and cord (traces on clay)", "mammoth, reindeer and horse as main game"]}
      - {role: processing, items: ["bone and ivory needles", "ground stone pestles for plants"]}
    ornaments: ["beads of ivory, shell and teeth, sewn on clothes and caps (Sunghir)", "pierced animal teeth"]
    art: ["'Venus' figurines of ivory, stone and baked clay", "hand stencils in caves (Gargas)"]
    summary: "Gravettian mammoth hunters of the Ice Age plains: figurines, beaded clothing, cord and nets."
    verification: checked
    could_not_verify: "The Gargas hand stencils are not firmly dated (a bone in a wall crack is ~27 ka); I confirmed Soffer et al. 2000's title (textiles, basketry, cordage and nets) but not its cordage-on-clay detail. Sikora 2017 gives Sunghir's date (~34 ka), not the bead details. The span was 33-22 ka; the dated Gravettian runs ~35-34 to 26-25 ka (Ruiz-Redondo 2022, Adriatic only; no western dating paper was found), so it is now 34-25."
    source: "Soffer, Adovasio & Hyland 2000 Curr Anthropol 41:511 (doi:10.1086/317381); Sikora et al. 2017 Science 358:659 (doi:10.1126/science.aao1807; Sunghir ~34 ka); Revedin et al. 2010 PNAS 107:18815 (doi:10.1073/pnas.1006993107; starch on grinding tools at Bilancino, Kostenki 16, Pavlov VI, from ~30 ka); Ruiz-Redondo et al. 2022 (doi:10.1016/j.quascirev.2021.107319); Pidoplichko 1998 Upper Palaeolithic Dwellings of Mammoth Bones in the Ukraine, BAR Int Ser 712 (doi:10.30861/9780860549499; a book, not read)."

  - id: aurignacian
    name: "Aurignacian (Europe)"
    makers: ["H. sapiens"]
    bbox: [[-10, 36, 42, 56]]
    from_ka_bp: 43
    to_ka_bp: 33
    shelter: {phrase: "caves and rock shelters at the cave mouth, hearths, open-air camps", material: "stone and hide"}
    tools:
      - {role: hunting, items: ["split-base antler points on spears", "horse, reindeer, red deer and bison"]}
      - {role: processing, items: ["bone awls and needles", "carinated scrapers and burins"]}
    ornaments: ["thousands of ivory and shell beads, many made in a few set shapes", "pierced teeth"]
    art: ["ivory figurines: the Lion-human of Hohlenstein-Stadel, the Hohle Fels woman", "bone and ivory flutes (Hohle Fels)", "cave paintings (Chauvet, first phase c. 37-33.5 ka)"]
    summary: "Europe's first Homo sapiens culture: carved ivory, bone flutes and the oldest cave paintings."
    verification: checked
    could_not_verify: "The bead, point, game and scraper details have no paper here, and the Lion-human's attribution was not read. The Early Aurignacian start (~43-42 ka cal BP at Geissenkloesterle) was not seen in the abstract. 'The oldest cave paintings' is no longer true: Sulawesi and Borneo art is older (see the Wallacean entry), and Iberian art older than 64.8 ka is Neanderthal (see the Mousterian entry); read it as Europe's oldest sapiens art."
    source: "Conard 2009 Nature 459:248 (doi:10.1038/nature07995; Hohle Fels figurine, basal Aurignacian, >= 35,000 cal BP); Conard, Malina & Muenzel 2009 Nature 460:737 (doi:10.1038/nature08169; flutes, >35,000 cal BP); Higham et al. 2012 J Hum Evol 62:664 (doi:10.1016/j.jhevol.2012.03.003; Geissenkloesterle ultrafiltration radiocarbon chronology); Quiles et al. 2016 PNAS 113:4670 (doi:10.1073/pnas.1523158113; Chauvet: two phases of human activity, 37-33.5 and 31-28 ka). An earlier note cited Higham 2011 Nature 479:521 for Aurignacian dating; that paper is Kent's Cavern."

  - id: initial_upper_palaeolithic
    name: "Initial Upper Palaeolithic (Bacho Kiro, Uluzzian and kin)"
    makers: ["H. sapiens"]
    bbox: [[8, 36, 42, 56]]
    from_ka_bp: 47
    to_ka_bp: 42
    shelter: {phrase: "cave camps with hearths", material: "stone and hearth"}
    tools:
      - {role: hunting, items: ["long blades struck from prepared cores", "bone points"]}
      - {role: processing, items: ["end scrapers", "bone awls"]}
