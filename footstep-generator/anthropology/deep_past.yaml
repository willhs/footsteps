  # ---- Neanderthal toolkits (not for a clicked person; labelled as another hominin's) -------
  - id: mousterian
    name: "Mousterian (Neanderthal)"
    makers: ["Neanderthals"]
    bbox: [[-12, 35, 90, 60]]
    from_ka_bp: 300
    to_ka_bp: 40
