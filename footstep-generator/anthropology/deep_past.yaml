    source: "Hajdinjak et al. 2021 Nature 592:253 (Bacho Kiro, 45.9-42.6 ka); Hublin et al. 2020 Nature 581:299; Benazzi et al. 2011 Nature 479:525 (Uluzzian) — checked against arrivals.yaml."

  - id: east_europe_upper_palaeolithic
