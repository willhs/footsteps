# Typical big game by Krapp BIOME4 class. A rough, general description of what foragers found there,
# not a list of species at a place (the fauna ranges give those). Used beside the ranges, always.
# Sources: Kelly 2013 The Lifeways of Hunter-Gatherers (CUP); Binford 2001 Constructing Frames of
# Reference (UC Press) — both from memory; verification: memory.
biome_prey:
  verification: memory
  source: "Kelly 2013 The Lifeways of Hunter-Gatherers; Binford 2001 Constructing Frames of Reference."
  groups:
    - {biomes: [1, 2], name: tropical forest, game: ["pigs", "small deer and antelope", "monkeys", "rodents", "fish and honey"]}
    - {biomes: [3, 12, 13, 19], name: tropical savanna and woodland, game: ["antelope and zebra herds", "wild cattle and buffalo", "elephant and rhino (rarely)", "warthog and smaller game"]}
    - {biomes: [4, 5, 6, 7, 8, 15, 16], name: temperate woodland, game: ["red and roe deer", "wild boar", "wild cattle", "hare and beaver", "nuts, fish and waterfowl"]}
    - {biomes: [9, 10, 11, 17, 18], name: cold forest and taiga, game: ["elk or moose", "reindeer or caribou", "beaver, hare and grouse", "salmon and other river fish"]}
    - {biomes: [14, 20, 22], name: grassland, steppe and steppe tundra, game: ["horse and wild ass", "bison, aurochs or other wild cattle", "saiga and gazelle", "mammoth where cold", "reindeer in the cold"]}
    - {biomes: [21, 27], name: desert and barren, game: ["gazelle and wild ass near water", "ibex and sheep in the hills", "hare, lizards and seeds"]}
    - {biomes: [23, 24, 25, 26], name: tundra, game: ["reindeer or caribou", "musk ox", "arctic hare and fox", "waterfowl and fish"]}
