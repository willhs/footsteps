    ornaments: ["pierced shells and animal teeth"]
    art: ["engraved and painted caves and plaques (Parpalló, Spain)"]
    summary: "Solutrean hunters of the last glacial peak, with the best-made stone points and the first eyed needles."
    verification: memory
