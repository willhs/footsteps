    summary: "The stone-tool tradition of the Neanderthals across Europe and western Asia."
    verification: memory
    source: "Hoffmann et al. 2018 Science 359:912 (cave art older than 64.8 ka); Zilhão et al. 2010 PNAS 107:1023 (shell ornaments); Jaubert et al. 2016 Nature 534:111 (Bruniquel); Higham et al. 2014 Nature 512:306 — from memory except the last."

