# Material culture and prey for the modelled deep past (100,000-11,000 BCE), per region and time.
# Read by build.py (`deep`), which writes it into the atlas next to the arrival table
# (footstep-generator/prehistory/arrivals.yaml). Nothing here is gap-filled by a model.
#
# One entry per technocomplex (a named stone-tool tradition, with what archaeology links to it).
#   makers      who made it: "H. sapiens", "Neanderthals", "Denisovans". Only entries with
#               "H. sapiens" speak for a clicked person; the others are labelled as another hominin's.
#   bbox        [west, south, east, north] degrees; any box may hold the cell centre
#   from_ka_bp / to_ka_bp   start (older) and end (younger), thousands of years before 1950.
#               Real traditions overlap and fade in and out by site; these are round, regional spans.
#   shelter     {phrase, material}: what archaeologists found people living in or under
#   tools       [{role, items}]; ornaments; art: what is recorded, as short phrases
#   summary     one line shown with the name
#   verification  checked = key claim confirmed against the paper's abstract or a reliable summary;
#                 memory  = citation and claim written from memory, NOT yet checked against the paper.
#                 The atlas passes this on in each field's note; a `memory` entry must not be
#                 presented as sourced.
#   source      the papers or books behind the entry
# Selection (atlas.py): of the entries holding the cell centre, those overlapping the era; the one
# overlapping the most wins, the one with the smaller box on a tie (then the earlier in this file).
#
# Where a field is empty the archaeology is silent or this table has not covered it: the atlas says
# "none" and lets the model gap-fill (clothing, diet, looks), marked as model.

version: 1

cultures:
  # ---- Africa ------------------------------------------------------------------------------
  - id: aterian
    name: "Aterian (North Africa, Middle Stone Age)"
    makers: ["H. sapiens"]
    bbox: [[-17, 18, 35, 37]]
    from_ka_bp: 145
    to_ka_bp: 30
    shelter: {phrase: "caves and rock shelters with hearths", material: "stone and hearth, no built walls recorded"}
    tools:
      - {role: hunting, items: ["tanged stone points, probably hafted spear or dart tips", "side scrapers"]}
      - {role: processing, items: ["flake scrapers for hides and wood", "Levallois flakes"]}
    ornaments: ["perforated sea-shell beads (Taforalt, c. 82 ka)", "ochre"]
    art: []
    summary: "Tanged points and shell beads across the Maghreb and Sahara, long before Europe's Upper Palaeolithic."
    verification: memory
    source: "Bouzouggar et al. 2007 PNAS 104:9964 (Grotte des Pigeons, Taforalt: shell beads c. 82 ka); Scerri 2013 Quat Int 300:111 (the Aterian, from memory)."

  - id: iberomaurusian
    name: "Iberomaurusian (Maghreb, Late Stone Age)"
    makers: ["H. sapiens"]
    bbox: [[-17, 28, 12, 37]]
    from_ka_bp: 25
    to_ka_bp: 11
    shelter: {phrase: "cave camps near the coast and uplands; large cemeteries at Taforalt", material: "stone and hearth"}
    tools:
      - {role: hunting, items: ["backed bladelets, probably set in spears and arrows", "Barbary sheep and gazelle as main game"]}
      - {role: gathering, items: ["grinding stones for acorns, pine nuts and wild plants", "land snail collecting"]}
    ornaments: ["perforated shells", "pierced animal teeth"]
    art: ["engraved and painted pebbles are rare"]
    summary: "Backed-bladelet foragers of the Maghreb, c. 25-11 ka, who ground acorns and buried their dead in cave cemeteries."
    verification: memory
    source: "Taforalt (Morocco) excavations; Humphrey et al. 2014 Quat Sci Rev, Barton et al. — both from memory."

  - id: africa_msa
    name: "Middle Stone Age (Africa)"
    makers: ["H. sapiens"]
    bbox: [[-20, -35, 52, 37]]
    from_ka_bp: 300
    to_ka_bp: 40
    shelter: {phrase: "caves, rock shelters and open camps with hearths; grass and sedge bedding laid on the floor", material: "stone, hearth, plant bedding"}
    tools:
      - {role: hunting, items: ["stone-tipped spears", "small stone points, perhaps arrow tips after 60 ka", "heat-treated stone for sharper flakes"]}
      - {role: processing, items: ["bone awls and points", "ochre grinding stones", "ochre-and-resin glue for hafting"]}
    ornaments: ["shell beads strung from Nassarius snails (Blombos, c. 75 ka)", "ochre"]
    art: ["engraved ochre (Blombos, c. 77 ka)", "ochre crayon drawing on stone (Blombos, c. 73 ka)", "engraved ostrich eggshell (Diepkloof, c. 60 ka)"]
    summary: "The Middle Stone Age of the first Homo sapiens: hafted points, shell beads, engraved ochre."
    verification: memory
    source: "McBrearty & Brooks 2000 J Hum Evol 39:453; Henshilwood et al. 2002 Science 295:1278 (Blombos); Henshilwood et al. 2018 Nature 562:115; Texier et al. 2010 PNAS 107:6180 (Diepkloof); Wadley et al. 2011 Science 334:1388 (Sibudu bedding); Brown et al. 2012 Nature 491:590 (heat treatment) — from memory."

  - id: africa_lsa
    name: "Later Stone Age (Africa)"
    makers: ["H. sapiens"]
    bbox: [[-20, -35, 52, 28]]
    from_ka_bp: 40
    to_ka_bp: 11
    shelter: {phrase: "rock shelters and open-air camps with hearths and windbreaks", material: "stone, brush and hide"}
    tools:
      - {role: hunting, items: ["bows and small stone-tipped arrows", "bone arrowheads and poison-grooved points", "snares and traps"]}
      - {role: gathering, items: ["digging sticks weighted with bored stones", "ostrich eggshell water containers"]}
      - {role: processing, items: ["bone needles and awls", "tiny stone scrapers and backed blades (microliths)"]}
    ornaments: ["ostrich eggshell beads", "pierced shells and teeth"]
    art: ["painted slabs (Apollo 11 Cave, Namibia, c. 27 ka)", "rock engravings and paintings, mostly later and hard to date"]
    summary: "Microlith foragers of the Later Stone Age: bows, ostrich eggshell beads, bone needles. Start dates run from c. 50 ka in East Africa to c. 20 ka in the south."
    verification: memory
    source: "Mitchell 2002 The Archaeology of Southern Africa (CUP); Ambrose 1998 J Hum Evol 34:623; Wendt 1976 (Apollo 11 slabs) — from memory."

  # ---- Levant and Arabia -------------------------------------------------------------------
