    bbox: [[32, 28, 45, 38]]
    from_ka_bp: 23
    to_ka_bp: 11.7
    shelter: {phrase: "from mobile camps to the first year-round stone-footed round huts of the Natufian (c. 14.5 ka on)", material: "stone footings, brush and hides"}
    tools:
      - {role: hunting, items: ["tiny geometric stone blades set in spears and arrows", "gazelle as main game"]}
      - {role: gathering, items: ["grinding stones and mortars", "sickle blades with gloss from cutting wild cereals"]}
    ornaments: ["dentalium shell beads", "bone and stone pendants"]
    art: ["small carved animal figures in stone and bone (Natufian)"]
    summary: "Kebaran camps and the Natufian base camps of the Levant, where foragers began living in one place and harvesting wild grain."
    verification: memory
    source: "Bar-Yosef 1998 Evol Anthropol 6:159 (The Natufian culture in the Levant) — from memory."

  - id: levant_upper_palaeolithic
    name: "Early Ahmarian and Levantine Aurignacian"
    makers: ["H. sapiens"]
    bbox: [[32, 28, 45, 38]]
    from_ka_bp: 47
    to_ka_bp: 23
    shelter: {phrase: "cave and rock-shelter camps with hearths", material: "stone and hearth"}
    tools:
      - {role: hunting, items: ["narrow stone blades and points (Ahmarian), set in spears", "gazelle, fallow deer and wild cattle"]}
      - {role: processing, items: ["bone points and awls", "end scrapers"]}
    ornaments: ["perforated marine shells", "bone and antler pendants"]
    art: []
    summary: "The Upper Palaeolithic of the Levant, with blade technology like Europe's earliest."
    verification: memory
    source: "Bar-Yosef 2007 (Levantine Upper Palaeolithic) — from memory; Boker Tachtit / Ksar Akil."

  - id: levant_middle_palaeolithic
    name: "Levantine Mousterian (Middle Palaeolithic)"
    makers: ["H. sapiens", "Neanderthals"]
    bbox: [[32, 12, 60, 38]]
    from_ka_bp: 250
    to_ka_bp: 47
    shelter: {phrase: "caves and rock shelters with hearths", material: "stone and hearth"}
    tools:
      - {role: hunting, items: ["Levallois flakes and points, perhaps hafted as spear tips"]}
      - {role: processing, items: ["side scrapers", "ochre"]}
    ornaments: ["perforated Nassarius shells (Skhul and Qafzeh, c. 100-90 ka)"]
    art: ["ochre pieces and burials with grave goods (Qafzeh, c. 100 ka)"]
    summary: "Mousterian toolkit shared by early Homo sapiens (Skhul, Qafzeh) and Neanderthals in the Levant."
    verification: memory
    source: "Vanhaeren et al. 2006 Science 312:1785 (shell beads); Hovers et al. 2003 Curr Anthropol 44:491 (Qafzeh ochre); Hershkovitz et al. 2018 Science 359:456 (Misliya) — from memory."

  # ---- Europe ------------------------------------------------------------------------------
