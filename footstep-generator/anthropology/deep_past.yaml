    verification: memory
    source: "Conard 2009 Nature 459:248 (Hohle Fels figurine); Conard, Malina & Münzel 2009 Nature 460:737 (flutes); Higham et al. 2011 Nature 479:521 (Aurignacian dating) — from memory."

