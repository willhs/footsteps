      - {role: processing, items: ["hide scrapers", "bone and antler tools"]}
    ornaments: ["bone and antler beads"]
    art: []
    summary: "Beringian foragers of the land bridge and Alaska before the Americas opened."
    verification: checked
    could_not_verify: "The span was 24-11 ka; the microblade tradition itself is after ~16.5 ka (Goebel et al. 2008), with Ushki-1 at ~13 cal ka. The earlier people in this box (Bluefish Caves, cut-marked bone at 24 cal ka; the arrival table) left no toolkit recorded here, so 24-16 ka now falls to 'none' rather than being filled with a toolkit that postdates it. Graf & Buvit 2017's abstract was not read. Shelters, game list, tools and beads have no paper here."
    source: "Goebel, Waters & O'Rourke 2008 Science 319:1497 (doi:10.1126/science.1153569; Beringian dispersal after ~16.5 ka); Goebel et al. 2010 J Archaeol Sci 37:2640 (doi:10.1016/j.jas.2010.05.024; Ushki-1); Bourgeon et al. 2017 PLoS ONE 12:e0169486 (doi:10.1371/journal.pone.0169486; Bluefish Caves 24 cal ka); Moreno-Mayar et al. 2018 Nature 553:203 (doi:10.1038/nature25173; Upward Sun River, ~11.5 ka, genome paper). Hamilton & Goebel 1999 (a book chapter) was dropped."

