# Language expansions: where a family was spreading, from when, on whose authority.
#
# Research 0007 (docs/research/0007-languages-over-time/research.md), plan steps 2 (historical and colonial
# movements) and 3 (deep-time expansions, Findings §2). Read docs/ops/languages.md before using. Rules:
#  - One row per movement. `kind: historical` rows have `start_year` (CE, negative BCE); `kind: deep` rows have
#    `start_bp: [lo, hi]`, years before 1950, the study's range (lo = recent end, hi = older end).
#  - `boxes`: the area, as 5° boxes [south, west, north, east] on the atlas grid (all multiples of 5; south < north,
#    west < east). Boxes are a coarse hand-drawn area, not a boundary. Only a `disputed` row may have no boxes, and
#    then it is never shown (Indo-European, Afro-Asiatic and Uto-Aztecan until a model is chosen).
#  - `checked: true` means the date (and, for deep rows, the place) was read this session in the source's abstract or
#    text, fetched from its DOI or publisher page; `source` then carries the doi: or URL. `checked: false` means it was
#    not, and `unverified` says why. A test enforces both. Wikipedia counts as secondary: a date read only there is
#    unverified (Britannica, Te Ara, NZHistory and the NMA refused automated fetches on 2026-11-21).
#  - Nothing is ever shown before 5 ka (5,000 BP = 3050 BCE), whatever a row says: the floor is applied when the asset
#    is built and again by the web lookup.
#  - No family colours on the globe. This table feeds one hover-card line behind ?langs=deep.
#
# Compile: poetry run python footstep-generator/anthropology/languages_expansions.py
#   -> footsteps-web/public/languages/expansions.json
