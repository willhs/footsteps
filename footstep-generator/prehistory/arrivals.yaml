# Habitat rules for forager density. These multiply or limit the NPP-based potential density
# from Tallavaara et al. 2018 (PNAS 115:1232, doi:10.1073/pnas.1715638115; Miami-model NPP from annual
# mean temperature and precipitation; published under the PNAS licence, not CC BY as an earlier note said).
# Values are modelling choices
# informed by anthropology, not fitted to data: they are defaults for the first prototype and
# should be tuned or ablated once a comparison with Timmermann & Friedrich 2016 (Nature 538:92, doi:10.1038/nature19365) exists.
# Each rule names what to check in the ethnographic record before trusting the number.
habitat_rules:
  coast:
    bonus: 1.5            # multiplier on density
    within_km: 20
    rationale: "Modelling choice (x1.5 is not fitted). Direction supported by Kelly 2013 Table 7-3 (coastal and riverine forager densities are mostly far above interior ones, with exceptions such as the Tasmanian coast) and by Tallavaara et al. 2018 (doi:10.1073/pnas.1715638115), whose terrestrial NPP model leaves out the aquatic productivity coastal groups relied on."
    verification: checked
    could_not_verify: "Binford 2001's own claim that aquatic resources lift density above the terrestrial prediction was not read; the 1.5 multiplier is a choice."
  river:
    bonus: 1.3
    within_km: 10
    rationale: "Modelling choice. Riverine forager densities are often high (Kelly 2013 Table 7-3: Mattole 210, Sinkyone 270, Puyallup 195 per 100 km2), but the 1.3 value and the 'travel corridor' idea are not sourced."
    verification: could_not_verify
    could_not_verify: "Only the high riverine densities in Kelly 2013 Table 7-3 were found; no source for floodplain richness or travel corridors, and the 1.3 is a choice."
  lake:
    bonus: 1.3
    within_km: 10
    rationale: "Modelling choice; no source checked. Lake margins and wetlands are assumed rich mixed habitats."
    verification: could_not_verify
    could_not_verify: "No paper or book page found for a lake-margin density bonus; kept as an assumption."
  ecotone:
    bonus: 1.2
    description: "A cell whose 3x3 neighbourhood spans 2+ biomes (forest/grassland, mountain/plain)."
    rationale: "Modelling choice; no source checked. Mixed habitats are assumed to give more food types and seasonal fallbacks."
    verification: could_not_verify
    could_not_verify: "No source found for an ecotone density bonus; kept as an assumption."
  cold_limit:
    # The coldest-month mean is a predictor of hunter-gatherer habitat in Tallavaara et al. 2015
    # (doi:10.1073/pnas.1503784112, calibrated on Binford's 339-population dataset). Tallavaara 2018 uses
    # annual mean temperature and precipitation, not Binford's effective temperature.
    coldest_month_mean_c:
      zero_below: -35   # no occupation
      full_above: -20   # no penalty
    interpolation: linear
    rationale: "Modelling choice (the -35 to -20 C ramp is not fitted). Coldest-month mean temperature is a predictor of Europe-wide hunter-gatherer habitat in Tallavaara et al. 2015 (doi:10.1073/pnas.1503784112); winter fuel, clothing and storage limit high-latitude foragers."
    verification: checked
    could_not_verify: "The thresholds, and the earlier claim that below about -30 C few ethnographic groups occur outside the Arctic, were not found in Binford, Kelly or Tallavaara; that claim was dropped."
  aridity:
    npp_floor_g_m2_yr: 100   # below this, density 0
    npp_ramp_to: 300         # linear ramp from floor to here
    rationale: "Modelling choice. Direction supported by Tallavaara et al. 2018 (doi:10.1073/pnas.1715638115): hunter-gatherer density rises with Miami-model NPP below a breakpoint near 1,360 g/m2/yr and is largely independent above it. The 100 floor and 300 ramp are not fitted; the Sahara and Rub' al Khali cores are hard-zeroed rather than trusting a tiny positive NPP."
    verification: checked
    could_not_verify: "The floor and ramp values are choices; the earlier claim that the Tallavaara fit already drops to near-zero in deep desert was not checked."
  ice_and_sea:
    ice: "density 0 under ice sheets (Krapp/Beyer ice mask)"
    sea: "density 0 on sea; shelf land exposed by lower sea level IS inhabitable (Spratt sea level)."
    verification: checked
  refugia:
    description: "Glacial refugia: during MIS 4 (~71-57 ka) and the LGM (~26-19 ka) cold-limit and aridity rules empty large northern areas; people are kept in southern refugia (Iberia, Italy/Balkans, Ukraine, S China, Mediterranean North Africa)."
    candidates:
      - {name: Franco-Cantabrian and Iberia, bbox: [-10, 35, 3, 44]}
      - {name: Italy and the Balkans, bbox: [8, 36, 30, 46]}
      - {name: Black Sea and Ukraine, bbox: [28, 42, 42, 50]}
      - {name: South China, bbox: [100, 20, 120, 32]}
    rationale: "Modelling choice: the cold and aridity rules empty the north at MIS 4 and the LGM; the refugia list keeps people in the south. LGM = 26.5-19 ka (Clark et al. 2009, doi:10.1126/science.1172873). Tallavaara et al. 2015 (doi:10.1073/pnas.1503784112) simulate Europe's population at ~330,000 people 30 ky ago, a minimum of ~130,000 at 23 ky ago and ~410,000 by 13 ky ago (an earlier note wrote these as 'ka'), densest in Iberia and the Mediterranean with the northern limit near southern Ukraine, and report an unfragmented range, not isolated refugia. Posth et al. 2023 (Nature 615:117) support France/Iberia as refugia."
    verification: could_not_verify
    could_not_verify: "Italy/Balkans is not supported as a refugium (Posth 2023, press summary: Italy's population was replaced, and the paper was not read); the South China refuge has no source found (the Frontiers genomics review notes no LGM DNA from there); MIS 4 = 71-57 ka is from the LR04 stack (Lisiecki & Raymo 2005, doi:10.1029/2004PA001071), whose table was not re-read. The earlier citation of Posth 2016 as Nat Commun 7:10713 was wrong (it is Curr Biol 26:827) and was dropped."
  ramp:
    description: "After the arrival date, density rises linearly from 0 to its potential value over `ramp_ka` thousand years (per region). Cells also gain density only if a neighbour cell is already occupied (diffusion front), to stop isolated blobs appearing in Sahul or the Americas."
    verification: could_not_verify
    could_not_verify: "A pure modelling device (a ramp and a diffusion front); there is no literature claim in it to check."
