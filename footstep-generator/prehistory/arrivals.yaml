# Arrival and habitat table for the modelled pre-HYDE population
# (docs/research/0002-pre-hyde-population-model/research.md, sections 3 and Conclusions 3).
#
# Dates are years before present (ka BP = thousands of years before 1950).
# BCE = ka*1000 - 1950, rounded to the nearest 100 (so 50 ka BP = 48,050 BCE ~ 48,000 BCE).
# Each region: `central` drives the model; `early` and `late` bracket the credible range;
# `alt` records a contested alternative (not used unless a scenario switches to it).
#
# verification:
#   checked          = the cited papers exist (DOI in `source`) and the key figure was confirmed against the
#                      paper's abstract or full text (2026-11-13 web pass; the memory-only entries on 2026-11-19).
#                      `could_not_verify` (optional here) names the details of an entry no paper was found for,
#                      for example a model inference that the cited papers do not state.
#   could_not_verify = the claim could not be confirmed; the required `could_not_verify` field says why.
#                      The atlas shows that reason beside the claim.
# No entry is left as `memory`. A date changed by more than ~10% in the 2026-11-19 pass is listed in
# docs/research/0013-arrivals-deep-past-source-check; the population model has NOT been rerun for it.
#
# Optional per-region model knobs (research 0009, applied 2026-11-21 in docs/tasks/0012):
#   density_multiplier: [[ka_bp, m], ...]  m in 0..1, linear between points, held outside; scales the
#                       region's occupancy, and the world rescale gives what it removes to everyone else (P5)
#   weight_evidence: none   no dated evidence tests this region's share of the world; its people widen the
#                       counter's low-high range (prehistory_population.py UNEVIDENCED_FACTOR, P8)
#   hyde_after_arrival: true   HYDE's 10,000 BCE people in the box join the 14,000-10,000 BCE hand-over only
#                       after the region's arrival date (P9)
#
# bbox is [west, south, east, north] in degrees; a cell belongs to the FIRST matching
# region in file order (so put small/specific regions before big ones). Boxes are
# deliberately coarse: they decide "who could be here by when", not coastlines
# (the land/ice mask does that).

version: 1
epoch: 1950   # ka BP is relative to this year CE

regions:
  # Islands that sit inside a big continental box below but were settled much later come FIRST.
  - id: madagascar_indian_ocean
    name: Madagascar and the western Indian Ocean islands
    bbox: [43, -26, 58, -10]
    arrival_ka_bp: {central: 2.3, early: 4.0, late: 1.0}
    ramp_ka: 1
    hyde_after_arrival: true   # research 0009 P9: HYDE's 10,000 BCE people here join the hand-over only after arrival
    verification: checked
    source: "Burney et al. 2004 J Hum Evol 47:25 (doi:10.1016/j.jhevol.2004.05.005; earliest human presence ca. 2300 14C yr BP, 350 cal BC); Dewar et al. 2013 PNAS 110:12583 (doi:10.1073/pnas.1306100110; forager occupation of one site from at least 2000 BC, ~4 ka; earlier visits 'scattered and contentious'). An earlier note here had the Burney citation as J Archaeol Sci 31:1 and Dewar's foragers as ~10 ka; both were wrong."
    notes: "After the model window, so empty throughout. Placed before `africa`, whose box would otherwise populate it from 100 ka."

  - id: caribbean
    name: Caribbean islands
    bbox: [-85, 17.5, -59, 24]   # Greater Antilles and the northern Lesser Antilles; keeps Central America out
    arrival_ka_bp: {central: 5.8, early: 6.0, late: 4.0}
    ramp_ka: 1
    hyde_after_arrival: true   # research 0009 P9: HYDE's 10,000 BCE people here join the hand-over only after arrival
    verification: checked
    source: "Napolitano et al. 2019 Sci Adv 5:eaar7806 (doi:10.1126/sciadv.aar7806; 2,484 radiocarbon dates, two dispersals from South America, the first ~5.8 ka into Cuba, Hispaniola and Puerto Rico, the second ~2.5 ka; the numbers are from the paper's press summaries, the full text was not reachable); Wilson 2007 The Archaeology of the Caribbean, Cambridge UP (doi:10.1017/CBO9780511816505). An earlier note had the earliest sites at ~7 ka; Napolitano's filtered dates do not support that, so `early` is now 6.0."
    notes: "After the model window, so empty throughout. Placed before `north_america`, whose box would otherwise populate it from 16 ka."

  - id: levant_arabia
    name: Levant, Mesopotamia and north Arabia (early, non-lasting exits)
    bbox: [34, 29, 60, 38]
    arrival_ka_bp: {central: 50, early: 120, late: 47}
    alt: {ka_bp: 100, note: "Skhul 100-135 ka (Grün 2005), Qafzeh ~92 ka, Misliya 177-194 ka; Al Wusta in the Arabian Nefud ~95-86 ka (Groucutt 2018). These pulses did not persist; the model treats them as optional low-density pulses, not the start of continuous occupation."}
    ramp_ka: 3
    verification: checked
    could_not_verify: "No cited paper says continuous occupation begins at 50 ka: the central date is the model's own inference from Manot 1 (54.7 +/- 5.5 ka) and the Initial Upper Palaeolithic horizon, whose sites (Boker Tachtit, Ksar Akil) were not re-read."
    source: "Hershkovitz et al. 2018 Science 359:456 (doi:10.1126/science.aap8369; Misliya maxilla 177-194 ka); Groucutt et al. 2018 Nature Ecol Evol 2:800 (doi:10.1038/s41559-018-0518-2; H. sapiens in Arabia before 85 ka, Al Wusta ~95-86 ka); Grün et al. 2005 J Hum Evol 49:316 (doi:10.1016/j.jhevol.2005.04.006; Skhul 100-135 ka); Hershkovitz et al. 2015 Nature 520:216 (doi:10.1038/nature14134; Manot 1, 54.7 +/- 5.5 ka)."
    notes: "Central date is the start of continuous occupation tied to the main exit. Early date is the first pulse."

  - id: south_arabia
    name: South Arabia
    bbox: [41, 12, 60, 29]
    arrival_ka_bp: {central: 72, early: 120, late: 47}
    density_multiplier: [[72, 0.15], [52, 0.15], [47, 1.0]]   # research 0016: sparse southern route before the main dispersal
    alt: {ka_bp: 100, note: "Skhul 100-135 ka (Grün 2005), Qafzeh ~92 ka, Misliya 177-194 ka; Al Wusta in the Arabian Nefud ~95-86 ka (Groucutt 2018). These pulses did not persist; the model treats them as optional low-density pulses, not the start of continuous occupation."}
    ramp_ka: 3
    verification: checked
    could_not_verify: "No cited paper says continuous occupation begins at 50 ka: the central date is the model's own inference from Manot 1 (54.7 +/- 5.5 ka) and the Initial Upper Palaeolithic horizon, whose sites (Boker Tachtit, Ksar Akil) were not re-read."
    source: "Hershkovitz et al. 2018 Science 359:456 (doi:10.1126/science.aap8369; Misliya maxilla 177-194 ka); Groucutt et al. 2018 Nature Ecol Evol 2:800 (doi:10.1038/s41559-018-0518-2; H. sapiens in Arabia before 85 ka, Al Wusta ~95-86 ka); Grün et al. 2005 J Hum Evol 49:316 (doi:10.1016/j.jhevol.2005.04.006; Skhul 100-135 ka); Hershkovitz et al. 2015 Nature 520:216 (doi:10.1038/nature14134; Manot 1, 54.7 +/- 5.5 ka)."
    notes: "Was the Levant's 50 ka until 2026-11-28. Separate box keeps northeast Africa in Africa. Research 0016: a thin southern-route presence 72-52 ka (density x0.15) joined up with Southeast Asia's early dates, full density with the main dispersal by 47 ka (Neanderthal admixture ~47-45 ka in all non-Africans)."

  - id: europe_south_iberia
    name: Southern Iberia
    bbox: [-10, 35, -1, 37]
    arrival_ka_bp: {central: 45, early: 54, late: 41}
    alt: {ka_bp: 54, note: "Grotte Mandrin, France, a sapiens-attributed tooth and Neronian layer at ~54 ka (Slimak et al. 2022 Sci Adv 8:eabj9496); a short pulse that did not persist."}
    ramp_ka: 3
    verification: checked
    source: "Hajdinjak et al. 2021 Nature 592:253 (Bacho Kiro IUP, 45.9-42.6 ka, confirmed in this pass); Fu et al. 2014 Nature 514:445 (Ust'-Ishim ~45 ka); Higham et al. 2014 Nature 512:306 (Neanderthal end 41.0-39.3 ka cal BP, Uluzzian overlap 2.6-5.4 ka, confirmed)."
    notes: "European date override before the Africa box; not evidence of African occupation in Iberia."

  - id: europe_sicily
    name: Sicily
    bbox: [12, 36, 16, 38]
    arrival_ka_bp: {central: 45, early: 54, late: 41}
    alt: {ka_bp: 54, note: "Grotte Mandrin, France, a sapiens-attributed tooth and Neronian layer at ~54 ka (Slimak et al. 2022 Sci Adv 8:eabj9496); a short pulse that did not persist."}
    ramp_ka: 3
    verification: checked
    source: "Hajdinjak et al. 2021 Nature 592:253 (Bacho Kiro IUP, 45.9-42.6 ka, confirmed in this pass); Fu et al. 2014 Nature 514:445 (Ust'-Ishim ~45 ka); Higham et al. 2014 Nature 512:306 (Neanderthal end 41.0-39.3 ka cal BP, Uluzzian overlap 2.6-5.4 ka, confirmed)."
    notes: "European date override before the Africa box; the land mask selects the island."

  - id: africa
    name: Africa (sub-Saharan, Maghreb, Nile valley)
    bbox: [-20, -35, 52, 37]
    arrival_ka_bp: {central: 300, early: 315, late: 200}
    ramp_ka: 0
    verification: checked
    source: "Hublin et al. 2017 Nature 546:289 (doi:10.1038/nature22336; Jebel Irhoud 315 +/- 34 ka by thermoluminescence); Richter et al. 2017 Nature 546:293 (doi:10.1038/nature22335; 315 +/- 34 ka, and 286 +/- 32 ka for the Irhoud 3 tooth). Central 300 is a round figure between the two. Whole region occupied for the entire model window."
    notes: "Present from before the model start (100 ka BP). Treated as populated throughout."

  - id: tibetan_plateau
    name: Tibetan Plateau (>3,000 m)
    bbox: [78, 27, 104, 36]
    arrival_ka_bp: {central: 38, early: 160, late: 30}
    alt: {ka_bp: 160, note: "The Xiahe mandible (Denisovan, >=160 ka) shows hominin presence, not H. sapiens. Stone tools on the plateau: Nwya Devu 40-30 ka at ~4,600 m (Zhang et al. 2018 Science 362:1049), with no hominin bones, so 'sapiens' is inferred. The Chusang handprints, once ~20 ka by OSL, were redated to 7.4-12.7 ka (Meyer et al. 2017 Science 355:64)."}
    ramp_ka: 8
    weight_evidence: none      # research 0009 P8: no dated evidence tests this region's share; widens the counter's range
    verification: checked
    could_not_verify: "Nwya Devu may have been redated: Ge et al. 2023 (doi:10.1007/s11430-022-1225-7) reports intermittent occupation over the past 45 ka; only its title was read."
    source: "Chen et al. 2019 Nature 569:409 (doi:10.1038/s41586-019-1139-x; Xiahe, >=160 ka by U-series); Zhang et al. 2018 Science 362:1049 (doi:10.1126/science.aat8824; Nwya Devu, 40-30 ka); Meyer et al. 2017 Science 355:64 (doi:10.1126/science.aag0357; Chusang)."
    notes: "Slow ramp: high-altitude hypoxia and cold. Central is for sapiens; the Denisovan record is under other_hominins."

  - id: japan
    name: Japan (Honshu, Kyushu and Shikoku)
    bbox: [129.5, 30, 142, 41.5]
    arrival_ka_bp: {central: 38, early: 40, late: 32}
    alt: {ka_bp: 32, note: "Earliest dated human bones are from the Ryukyus: Yamashita-cho Cave I charcoal 32.1 +/- 1.0 ka 14C BP (uncalibrated, ~36 ka cal by a secondary table) and Sakitari occupation 35-30 ka (Fujita et al. 2016). Honshu stone tools (trapezoids, edge-ground axes) from 40-38 ka (Nakazawa 2017)."}
    ramp_ka: 3
    weight_evidence: none      # research 0009 P8: no dated evidence tests this region's share; widens the counter's range
    verification: checked
    could_not_verify: "Yamashita-cho's calibrated age (~36 ka) comes from a secondary review table; the original 14C report (Kobayashi et al. 1971, Radiocarbon 13:100) was not read."
    source: "Nakazawa 2017 Curr Anthropol 58(S17):S539 (doi:10.1086/694447; full text read: edge-ground axes and trapezoids 40-38 ka, Hokkaido not before 30 ka, citing Izuho & Kaifu 2015 and Izuho et al. 2012, which have no DOI); Fujita et al. 2016 PNAS 113:11184 (doi:10.1073/pnas.1607857113; Sakitari 35,000-30,000 y ago); Suwa et al. 2011 Anthropol Sci 119:125 (doi:10.1537/asj.110727; Minatogawa charcoal 18.3 and 16.6 ka 14C BP). Nakagawa et al. 2010 (doi:10.1537/ase.091214) is Ishigaki Shiraho-Saonetabaru Cave, 20-16 ka, and was wrongly cited here for Yamashita-cho and Sakitari."
    notes: "Central 38 ka is the tool-based figure (Nakazawa 2017: 40-38 ka); bones imply 36-32 ka."

  - id: japan_hokkaido
    name: Japan (Hokkaido)
    bbox: [139.5, 41.5, 146, 45.5]
    arrival_ka_bp: {central: 30, early: 32, late: 28}
    alt: {ka_bp: 32, note: "Earliest dated human bones are from the Ryukyus: Yamashita-cho Cave I charcoal 32.1 +/- 1.0 ka 14C BP (uncalibrated, ~36 ka cal by a secondary table) and Sakitari occupation 35-30 ka (Fujita et al. 2016). Honshu stone tools (trapezoids, edge-ground axes) from 40-38 ka (Nakazawa 2017)."}
    ramp_ka: 3
    weight_evidence: none      # research 0009 P8: no dated evidence tests this region's share; widens the counter's range
    verification: checked
    could_not_verify: "Yamashita-cho's calibrated age (~36 ka) comes from a secondary review table; the original 14C report (Kobayashi et al. 1971, Radiocarbon 13:100) was not read."
    source: "Nakazawa 2017 Curr Anthropol 58(S17):S539 (doi:10.1086/694447; full text read: edge-ground axes and trapezoids 40-38 ka, Hokkaido not before 30 ka, citing Izuho & Kaifu 2015 and Izuho et al. 2012, which have no DOI); Fujita et al. 2016 PNAS 113:11184 (doi:10.1073/pnas.1607857113; Sakitari 35,000-30,000 y ago); Suwa et al. 2011 Anthropol Sci 119:125 (doi:10.1537/asj.110727; Minatogawa charcoal 18.3 and 16.6 ka 14C BP). Nakagawa et al. 2010 (doi:10.1537/ase.091214) is Ishigaki Shiraho-Saonetabaru Cave, 20-16 ka, and was wrongly cited here for Yamashita-cho and Sakitari."
    notes: "Changed 2026-11-19 from the main islands' 38 ka: the Hokkaido Palaeolithic record begins no earlier than ~30 ka (Nakazawa 2017). Separate box excludes Primorye and Sakhalin. early/late are bracket choices around 30 ka."

  - id: japan_ryukyu
    name: Japan (Ryukyu)
    bbox: [123, 24, 130, 30]
    arrival_ka_bp: {central: 36, early: 38, late: 32}
    alt: {ka_bp: 32, note: "Earliest dated human bones are from the Ryukyus: Yamashita-cho Cave I charcoal 32.1 +/- 1.0 ka 14C BP (uncalibrated, ~36 ka cal by a secondary table) and Sakitari occupation 35-30 ka (Fujita et al. 2016). Honshu stone tools (trapezoids, edge-ground axes) from 40-38 ka (Nakazawa 2017)."}
    ramp_ka: 3
    weight_evidence: none      # research 0009 P8: no dated evidence tests this region's share; widens the counter's range
    verification: checked
    could_not_verify: "Yamashita-cho's calibrated age (~36 ka) comes from a secondary review table; the original 14C report (Kobayashi et al. 1971, Radiocarbon 13:100) was not read."
    source: "Nakazawa 2017 Curr Anthropol 58(S17):S539 (doi:10.1086/694447; full text read: edge-ground axes and trapezoids 40-38 ka, Hokkaido not before 30 ka, citing Izuho & Kaifu 2015 and Izuho et al. 2012, which have no DOI); Fujita et al. 2016 PNAS 113:11184 (doi:10.1073/pnas.1607857113; Sakitari 35,000-30,000 y ago); Suwa et al. 2011 Anthropol Sci 119:125 (doi:10.1537/asj.110727; Minatogawa charcoal 18.3 and 16.6 ka 14C BP). Nakagawa et al. 2010 (doi:10.1537/ase.091214) is Ishigaki Shiraho-Saonetabaru Cave, 20-16 ka, and was wrongly cited here for Yamashita-cho and Sakitari."
    notes: "Central 36 ka (changed from 38 on 2026-11-19): the oldest dated human evidence is Yamashita-cho (~36 ka cal) and Sakitari (35-30 ka); 38 ka (the Honshu tool date) is kept as `early`. Separate southern island chain box."

  - id: south_asia
    name: South Asia (India, Sri Lanka, Pakistan, Nepal)
    bbox: [60, 5, 92, 36]
    arrival_ka_bp: {central: 72, early: 80, late: 45}
    density_multiplier: [[72, 0.15], [52, 0.15], [47, 1.0]]   # research 0016
    alt: {ka_bp: 74, note: "Jwalapuram, India, stone tools below the Toba ash (~74 ka), attributed to H. sapiens by Petraglia 2007 Science 317:114; the attribution is disputed."}
    ramp_ka: 3
    weight_evidence: none      # research 0009 P8: no dated evidence tests this region's share; widens the counter's range
    verification: checked
    source: "Wedage et al. 2019 Nat Commun 10:739 (doi:10.1038/s41467-019-08623-1; Fa-Hien Lena, Sri Lanka, earliest H. sapiens fossils in South Asia, ~45 ka); Wedage et al. 2019 PLOS ONE 14:e0222606 (doi:10.1371/journal.pone.0222606; microliths 48-45 ka cal BP); Langley et al. 2020 Sci Adv 6:eaba3831 (doi:10.1126/sciadv.aba3831; bow-and-arrow toolkit and symbolic material ~48 ka). An earlier note here had the PLOS ONE paper under Perera and the Nat Commun volume as 10:2."
    notes: "Was central 48 ka (Fa-Hien Lena microlith onset; fossils 45 ka) until 2026-11-28: South Asia was then empty while mainland Southeast Asia beyond it was full from 70 ka, which no route allows. Full density still comes at 48-47 ka, the Fa-Hien Lena onset. Research 0016: a thin southern-route presence 72-52 ka (density x0.15) joined up with Southeast Asia's early dates, full density with the main dispersal by 47 ka (Neanderthal admixture ~47-45 ka in all non-Africans)."

  - id: southeast_asia_mainland
    name: Mainland Southeast Asia (south of 22 N)
    bbox: [92, -2, 112, 22]
    arrival_ka_bp: {central: 70, early: 86, late: 46}
    density_multiplier: [[72, 0.15], [52, 0.15], [47, 1.0]]   # research 0016: two bones before 46 ka stay thin
    alt: {ka_bp: 46, note: "Skeletal evidence in Laos is Tam Pa Ling 2 (~46 ka); the 86-68 ka TPL 6/7 fragments are few and debated."}
    ramp_ka: 5
    weight_evidence: none      # research 0009 P8: no dated evidence tests this region's share; widens the counter's range
    verification: checked
    source: "Demeter et al. 2012 PNAS 109:14375 (Tam Pa Ling, >=46 ka); Demeter et al. 2022 / Freidline et al. 2023 Nat Commun 14:3193 (TPL 6/7, 86-68 ka)."
    notes: "Central uses the published 70 +/- 3 ka for TPL 6; low confidence because the sample is two bones. Model treats the 86-46 ka span as very sparse regardless. Capped at 22 N on 2026-11-21 (research 0009 P3): the box used to run to 28 N and so held Kunming, Guilin and Yuchanyan, where the oldest dated sites are 34.0 ka (Longtanshan) and 21.5 ka (Yuchanyan); that part is now `south_china`. Tam Pa Ling (20.2 N, 103.4 E) stays inside."

  - id: south_china
    name: Southern China and the north of mainland Southeast Asia (22-28 N)
    bbox: [92, 22, 112, 28]
    arrival_ka_bp: {central: 42, early: 80, late: 38}
    alt: {ka_bp: 80, note: "Daoxian, Hunan (Liu et al. 2015 Nature 526:696, 80-120 ka) -- widely doubted as secure sapiens attribution to the date."}
    ramp_ka: 8
    verification: checked
    could_not_verify: "No dated site in the box is older than 34 ka (research 0009: Longtanshan, Yunnan, 34.0 ka; Yuchanyan 21.5 ka), so 42 ka is `east_asia`'s date carried over, not a date this box's own evidence gives; the dated sites say 'not before 34 ka' and there are five of them."
    source: "Fu et al. 2013 PNAS 110:2223 (Tianyuan, ~40 ka, confirmed in this pass), as for `east_asia`; evidence in docs/research/0009-model-vs-evidence (section 1: Kunming, Guilin and Yuchanyan fell in the 70 ka mainland Southeast Asia box)."
    notes: "Added 2026-11-21 (research 0009 P3): this strip was part of `southeast_asia_mainland` (70 ka). It takes `east_asia`'s dates, with a slower ramp of 8 ka (research 0009 P3 and P6: the dated sites stay thin to ~35 ka). It also covers north Myanmar and Assam east of 92 E, where there is no evidence either way. Placed before `east_asia`, whose box would otherwise take it from 92 E; it holds the same boundary as the capped Southeast Asia row, so the order between the two does not matter."

  - id: philippines
    name: Philippines (Palawan, Luzon, the Visayas and north Mindanao)
    bbox: [116.9, 7.5, 127, 21]   # south edge 7.5 N keeps Sabah (Banggi, 7.3 N) in `island_se_asia_wallacea`
    arrival_ka_bp: {central: 47, early: 58, late: 31}
    alt: {ka_bp: 67, note: "Callao Cave, Luzon: a hominin metatarsal at 67 ka (Mijares et al. 2010), since assigned to H. luzonensis, not H. sapiens; listed for the 'not only us' note, not as a sapiens arrival."}
    ramp_ka: 3
    weight_evidence: none      # research 0009 P8: no dated evidence tests this region's share; widens the counter's range
    verification: checked
    could_not_verify: "Only Palawan has a dated sapiens fossil this old; using Tabon's date for Luzon, the Visayas and north Mindanao is the model's inference (they were islands throughout, and no older sapiens site there was checked). Détroit et al. themselves say the tibia's oldest possible age (~58 ka) 'has to be considered with caution'."
    source: "Détroit et al. 2004 C R Palevol 3:705 (doi:10.1016/j.crpv.2004.06.004; full text read 2026-11-28, Table 1: U-series on human bone, tibia fragment IV-2000-T-197 47 +11/-10 kyr BP, right mandible fragment 31 +8/-7, frontal bone 16.5 +/- 2.0; occupation layers 14C-dated ~30,500-9,000 BP). An earlier note cited this paper as J Hum Evol; it is Comptes Rendus Palevol."
    notes: "Added 2026-11-28 (research 0016 section 6, 0017): this box used to fall to `pacific_remote` (3.1 ka), so Palawan and the Visayas were empty until the HYDE blend. Central 47 ka is the Tabon tibia; late 31 ka the mandible. Placed before `island_se_asia_wallacea`; south Mindanao and the Sulu islands (below 7.5 N) stay in that box."

  - id: island_se_asia_wallacea
    name: Island Southeast Asia, Sunda shelf and Wallacea
    bbox: [95, -12, 126, 8]
    arrival_ka_bp: {central: 60, early: 70, late: 46}
    density_multiplier: [[72, 0.15], [52, 0.15], [47, 1.0]]   # research 0016
    alt: {ka_bp: 46, note: "Earliest securely dated sapiens skeleton on Borneo: Niah Cave activity ~46-34 ka (Barker et al. 2007 J Hum Evol 52:243). A route to Sahul at ~65-50 ka implies earlier transit."}
    ramp_ka: 3
    weight_evidence: none      # research 0009 P8: no dated evidence tests this region's share; widens the counter's range
    verification: checked
    could_not_verify: "Central 60 ka is the model's hedge between Lida Ajer (73-63 ka, one site, one study) and the secure archaeology (Niah 46 ka, Jerimalai 42-44 ka); no paper dates a transit at 60 ka. The Philippines north of 7.5 N are now their own row (`philippines`, Tabon 47 ka); Callao is H. luzonensis, not sapiens."
    source: "Barker et al. 2007 J Hum Evol 52:243 (doi:10.1016/j.jhevol.2006.08.011; Niah activity ca. 46,000 to ca. 34,000 years ago); Westaway et al. 2017 Nature 548:322 (doi:10.1038/nature23452; Lida Ajer, Sumatra, modern human teeth 73-63 ka); O'Connor et al. 2011 Science 334:1117 (doi:10.1126/science.1207703; Jerimalai, Timor, pelagic fishing 42 ka)."
    notes: "Corridor to Sahul; coastal sites are now drowned (sea level) so absence of evidence is expected."

  - id: sahul
    name: Sahul (Australia, New Guinea, Tasmania)
    bbox: [112, -45, 155, 0]
    arrival_ka_bp: {central: 50, early: 65, late: 47}
    alt: {ka_bp: 65, note: "Madjedbebe, Arnhem Land, OSL ages put the earliest artefacts at ~65 ka (Clarkson et al. 2017 Nature 547:306). The age and the artefact-to-layer association are disputed (O'Connell et al. 2018 Archaeol Oceania 53:1, 'optimistic interpretation'). Choose 65 for the early scenario."}
    ramp_ka: 4
    weight_evidence: none      # research 0009 P8: no dated evidence tests this region's share; widens the counter's range
    verification: checked
    source: "Clarkson et al. 2017 Nature 547:306 (65 ka, confirmed in this pass); Roberts et al. 1994 / O'Connell & Allen 2004 J Archaeol Sci 31:835 (consensus 50-47 ka); Bird et al. 2018 Sci Rep / Bradshaw et al. 2021 Nat Commun 12:5386 (carrying-capacity ceiling)."
    notes: "Central 50 ka (contested, documented alternative 65 ka). Lake Mungo 'older than 40 ka' ages are not used."
    # research 0016 section 4: Williams 2013 Proc R Soc B 280:20130486 (PMC3652441, abstract) finds "population fell by about
    # 60 per cent between 21 and 18 ka" in taphonomy-corrected radiocarbon; the model rose there. The size is left alone: published
    # figures span ~5,000-17,000 at 30 ka (Williams 2013 Table 1) to a 3.1-6.5 million saturation ceiling (Bradshaw et al. 2021
    # Nat Commun 12:2440, PMC8085232), and the model's ~200,000 sits between them.
    density_multiplier: [[21, 1.0], [18, 0.45], [15, 1.0]]

  - id: europe_west
    name: Europe (south and west)
    bbox: [-12, 35, 30, 55]
    arrival_ka_bp: {central: 45, early: 54, late: 41}
